<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/checkout.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form id="checkoutForm" class="checkout-form">
          <fieldset>
            <legend>Customer</legend>
            <label>First Name
              <input type="text" name="fname" required />
            </label>
            <label>Last Name
              <input type="text" name="lname" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Shipping</legend>
            <label>Street Address
              <input type="text" name="street" required />
            </label>
            <label>City
              <input type="text" name="city" required />
            </label>
            <label>State
              <input type="text" name="state" required />
            </label>
            <label>Zip Code
              <input type="text" name="zip" id="zip" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label>Credit Card Number
              <input type="text" name="cardNumber" required />
            </label>
            <label>Expiration Date
              <input type="text" name="expiration" placeholder="MM/YY" required />
            </label>
            <label>Security Code
              <input type="text" name="code" required />
            </label>
          </fieldset>

          <div class="order-summary">
            <h3>Order Summary</h3>
            <p>Subtotal: $<span id="orderSubtotal">0</span></p>
            <p>Tax: $<span id="orderTax">0</span></p>
            <p>Shipping: $<span id="orderShipping">0</span></p>
            <p>Order Total: $<span id="orderTotal">0</span></p>
          </div>

          <button type="submit" id="checkoutSubmit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>

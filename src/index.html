<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Top Categories</h2>
        <ul class="category-list">
          <li>
            <a href="/product_listing/?category=tents">
              <img src="/images/tents.svg" alt="Tents" />
              <p>Tents</p>
            </a>
          </li>
          <li>
            <a href="/product_listing/?category=backpacks">
              <img src="/images/backpacks.svg" alt="Backpacks" />
              <p>Backpacks</p>
            </a>
          </li>
          <li>
            <a href="/product_listing/?category=sleeping-bags">
              <img src="/images/sleeping-bags.svg" alt="Sleeping Bags" />
              <p>Sleeping Bags</p>
            </a>
          </li>
          <li>
            <a href="/product_listing/?category=hammocks">
              <img src="/images/hammocks.svg" alt="Hammocks" />
              <p>Hammocks</p>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
